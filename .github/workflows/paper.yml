name: Paper trading

# Funcionamiento 24/7 sin depender del cron de GitHub (que puede tardar horas en arrancar):
# cada ejecución corre el motor cada minuto durante ~5 h 40 min, publica la web cada ~7 min
# y al terminar lanza la siguiente ejecución. El cron es solo un respaldo por si la cadena se corta.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Paper trader (bucle de ~5 h 40 min)
        env:
          GH_TOKEN: ${{ github.token }}
          PT_STATE: state.json
          PT_DASH: site/index.html
          PT_LOG: run.log
          PT_GOLD_API: ${{ vars.PT_GOLD_API || 'gate' }}
          PT_NOTE: "El motor se ejecuta cada minuto en GitHub Actions y esta página se publica cada ~7 min. Si la hora de actualización tiene más de 30 min, revisa la pestaña Actions del repositorio."
        run: bash .github/loop.sh

      - name: Lanzar la siguiente ejecución
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run paper.yml -R "${{ github.repository }}" --ref "${{ github.ref_name }}"
