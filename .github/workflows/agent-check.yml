name: Prueba de la clave de la API

# Ejecútalo a mano (Actions -> Prueba de la clave de la API -> Run workflow) para comprobar que el secreto
# ANTHROPIC_API_KEY funciona. Hace una llamada mínima con Claude Haiku 5.5 (coste < 0,01 $).
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic
      - name: Llamada de prueba
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agents.py --selftest
      - name: Prueba del agente de entrada (Opus 5.5, ~0,05-0,10 $)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agents.py --selftest-entry
      - name: Prueba del agente gestor (Sonnet 5.5, ~0,01-0,03 $)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agents.py --selftest-manage
      - name: Prueba de noticias y sentimiento (Haiku 5.5, < 0,01 $)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pip install requests && python news.py
      - name: Prueba del agente de riesgo (Opus 5.5, ~0,01-0,03 $)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agents.py --selftest-risk
