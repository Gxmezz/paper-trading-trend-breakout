name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://www.okx.com/api/v5/market/candles?instId=XAU-USDT-SWAP&bar=1m&limit=1" \
                   "https://api.bitget.com/api/v2/mix/market/candles?symbol=XAUUSDT&productType=USDT-FUTURES&granularity=1m&limit=1" \
                   "https://api.gateio.ws/api/v4/futures/usdt/candlesticks?contract=XAU_USDT&interval=1m&limit=1" \
                   "https://futures.kraken.com/derivatives/api/v3/tickers/PF_XAUUSD"; do
            echo "== $u"; curl -s -m 15 -o /tmp/o -w "%{http_code}\n" "$u"; head -c 160 /tmp/o; echo; done
